name: BSE_37 Docker Commands

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check out QuizMate source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build image with Docker commands
        run: docker build -f Dockerfile -t "$DOCKERHUB_USERNAME/bse_37_commands:latest" .

      - name: Push image with Docker commands
        run: docker push "$DOCKERHUB_USERNAME/bse_37_commands:latest"
